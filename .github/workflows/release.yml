name: Release binaries

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: Build and upload release assets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...

      - name: Build and package release assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          mkdir -p build dist

          package_target() {
            local goos="$1"
            local goarch="$2"
            local package_name="klicktipp-mcp-${goos}-${goarch}"
            local package_dir="build/${package_name}"
            local binary_name="klicktipp-mcp"

            if [[ "${goos}" == "windows" ]]; then
              binary_name="${binary_name}.exe"
            fi

            mkdir -p "${package_dir}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build \
                -trimpath \
                -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
                -o "${package_dir}/${binary_name}" \
                ./cmd/klicktipp-mcp

            cp README.md TOOLS.md .env.example "${package_dir}/"

            if [[ "${goos}" == "windows" ]]; then
              (
                cd build
                zip -q -r "../dist/${package_name}.zip" "${package_name}"
              )
            else
              tar -C build -czf "dist/${package_name}.tar.gz" "${package_name}"
            fi
          }

          package_target darwin arm64
          package_target darwin amd64
          package_target linux amd64
          package_target linux arm64
          package_target windows amd64
          package_target windows arm64

          (
            cd dist
            sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          )

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
